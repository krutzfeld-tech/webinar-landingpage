services:
  - type: web
    name: webinar-landingpage
    runtime: static
    repo: https://github.com/krutzfeld-tech/webinar-landingpage
    branch: main
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /danke
        destination: /danke.html
